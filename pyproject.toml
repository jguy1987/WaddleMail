[project]
name = "WaddleMail"
dynamic = ["version"]
description = "Linux mail client for Microsoft 365 using Microsoft Graph"
requires-python = ">=3.10"
dependencies = [
    "msal>=1.28",
    "requests>=2.31",
    "keyring>=24",
    "nh3>=0.2.17",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
waddlemail = "waddlemail.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["waddlemail", "waddlemail.ui"]

[tool.setuptools.package-data]
"waddlemail.ui" = ["icons/*.svg", "icons/LICENSE-lucide.txt"]

[tool.setuptools.dynamic]
version = {attr = "waddlemail.__version__"}
